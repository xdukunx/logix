  <rect x="398" y="618" width="94" height="30" rx="6" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3"/>
  <text x="445" y="637" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">&#128274; Lock</text>

  <text x="1246" y="788" text-anchor="end" fill="#334155" font-size="10">Illustrative mockup &#8212; not a live screenshot</text>
