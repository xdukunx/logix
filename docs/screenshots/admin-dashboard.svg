  <circle cx="490" cy="470" r="5" fill="#10b981"/>
  <text x="298" y="484" fill="#f8fafc" font-size="15" font-weight="700">Lab PC 3</text>
  <text x="298" y="504" fill="#94a3b8" font-size="11">Hostname: LAB-PC-03</text>
  <text x="298" y="522" fill="#94a3b8" font-size="11">Status: Dalam Penggunaan</text>
  <text x="298" y="540" fill="#94a3b8" font-size="11">&#128337; Aktif: 14:32</text>

  <rect x="298" y="556" width="194" height="46" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="310" y="573" fill="#94a3b8" font-size="10">Pengguna:</text>
  <text x="310" y="590" fill="#f8fafc" font-size="12" font-weight="700">Budi Santoso</text>

  <rect x="298" y="618" width="90" height="30" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.3"/>
