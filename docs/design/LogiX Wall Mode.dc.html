<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #020617; color: #f1f5f9; -webkit-font-smoothing: antialiased; }
  @keyframes lx-breathe { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.9); } }
  @keyframes lx-fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .lx-tile { animation: lx-fadein .5s ease both; }
</style>
</helmet>

<div style="min-height: 100vh; background: radial-gradient(1200px 600px at 70% -10%, rgba(37,99,235,.14), transparent 60%), #020617; padding: 40px 48px; display: flex; flex-direction: column;">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid #1e293b;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <svg width="60" height="48" viewBox="0 0 60 48"><defs><pattern id="mW" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1e3a5f" stroke-width="5"></line></pattern></defs><rect x="1" y="1" width="58" height="46" rx="12" fill="url(#mW)" stroke="#334155" stroke-dasharray="4 4"></rect><text x="30" y="28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">mascot</text></svg>
      <div>
        <div style="font-size: 44px; font-weight: 800; letter-spacing: 0.18em; line-height: 1;">LOGI<span style="color: #3b82f6;">X</span></div>
        <div style="font-size: 15px; color: #64748b; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 6px;">Lab Kimia Komputasi · FTMM</div>
      </div>
    </div>
    <div style="margin-left: auto; text-align: right;">
      <div style="font-size: 56px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums;">{{ clock }}</div>
      <div style="font-size: 16px; color: #94a3b8; margin-top: 8px;">{{ dateStr }}</div>
    </div>
  </div>

  <!-- occupancy strip -->
  <div style="display: flex; align-items: center; gap: 20px; padding: 24px 0 28px; flex-wrap: wrap;">
    <div style="display: flex; align-items: baseline; gap: 14px;">
      <span style="font-size: 40px; font-weight: 800; letter-spacing: -0.02em;">6 <span style="color: #64748b; font-size: 26px;">/ 12</span></span>
      <span style="font-size: 20px; color: #cbd5e1; font-weight: 600;">stasiun dipakai</span>
    </div>
    <div style="flex: 1; min-width: 200px; max-width: 480px;">
      <div style="height: 14px; border-radius: 999px; background: #0f172a; overflow: hidden; display: flex; border: 1px solid #1e293b;">
        <div style="width: 33.3%; background: #22c55e;"></div><div style="width: 8.3%; background: #a855f7;"></div><div style="width: 8.3%; background: #3b82f6;"></div><div style="width: 16.7%; background: #f59e0b;"></div>
      </div>
    </div>
    <div style="display: flex; gap: 12px; margin-left: auto; flex-wrap: wrap;">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: #e2e8f0;"><span style="font-family: ui-monospace, monospace; color:#94a3b8;">&gt;_</span>4</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: #c4b5fd;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M9 8.5l4.5 1.8-1.9 0.9 1.2 2.3"></path></svg>1</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: #93c5fd;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><line x1="8" y1="14.5" x2="16" y2="14.5"></line></svg>1</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: #fbbf24;"><span style="width: 12px; height: 12px; border-radius: 50%; background: #f59e0b;"></span>2</span>
    </div>
  </div>

  <!-- station grid -->
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; flex: 1;">
    <sc-for list="{{ stations }}" as="s" hint-placeholder-count="12">
      <div class="lx-tile" style="background: {{ s.bg }}; border: 1px solid {{ s.border }}; border-left: 5px solid {{ s.accent }}; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; min-height: 150px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="width: 16px; height: 16px; border-radius: 50%; background: {{ s.accent }}; box-shadow: 0 0 0 4px {{ s.glow }}; flex-shrink: 0;"></span>
          <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em; color: {{ s.name }};">{{ s.id }}</span>
          <span style="margin-left: auto; color: {{ s.iconColor }};"><span style="font-family: ui-monospace, monospace; font-size: 20px; font-weight: 700;">{{ s.icon }}</span></span>
        </div>
        <div style="margin-top: auto; padding-top: 16px;">
          <div style="font-size: 15px; color: {{ s.sub }};">{{ s.userLabel }}</div>
          <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px;">
            <span style="font-size: 15px; font-weight: 700; color: {{ s.statusColor }};">{{ s.statusText }}</span>
            <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: {{ s.durColor }}; font-variant-numeric: tabular-nums;">{{ s.duration }}</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- footer -->
  <div style="display: flex; align-items: center; gap: 12px; padding-top: 24px; margin-top: 8px; border-top: 1px solid #1e293b;">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #4ade80;"><span style="width: 9px; height: 9px; border-radius: 50%; background: #22c55e; animation: lx-breathe 2.4s ease-in-out infinite;"></span>Server Terhubung</span>
    <span style="font-size: 14px; color: #475569;">·</span>
    <span style="font-size: 14px; color: #64748b;">Diperbarui {{ clock }}</span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #475569;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>Mode tampilan · hanya lihat, tanpa kontrol</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { now: new Date() };
  componentDidMount() {
    this._t = setInterval(() => this.setState({ now: new Date() }), 1000);
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const n = this.state.now;
    const p = (x) => String(x).padStart(2, '0');
    const clock = `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
    const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const dateStr = `${days[n.getDay()]}, ${n.getDate()} ${months[n.getMonth()]} ${n.getFullYear()}`;

    const IN = { bg:'#0f172a', border:'#1e293b', accent:'#22c55e', glow:'rgba(34,197,94,.18)', name:'#f1f5f9', sub:'#94a3b8', statusColor:'#4ade80', durColor:'#f1f5f9', iconColor:'#cbd5e1' };
    const LOCK = { bg:'#0f172a', border:'#1e293b', accent:'#f59e0b', glow:'rgba(245,158,11,.18)', name:'#f1f5f9', sub:'#94a3b8', statusColor:'#fbbf24', durColor:'#fbbf24', iconColor:'#93c5fd' };
    const IDLE = { bg:'#0f172a', border:'#1e293b', accent:'#64748b', glow:'rgba(100,116,139,.18)', name:'#e2e8f0', sub:'#94a3b8', statusColor:'#94a3b8', durColor:'#94a3b8', iconColor:'#94a3b8' };
    const OFF = { bg:'#0b1120', border:'#1e293b', accent:'#6b7280', glow:'transparent', name:'#475569', sub:'#475569', statusColor:'#475569', durColor:'#475569', iconColor:'#475569' };

    const mk = (id, icon, userLabel, statusText, duration, t) => ({ id, icon, userLabel, statusText, duration, ...t });

    const stations = [
      mk('WS-07', '>_', 'dhana', 'Aktif · SSH', '2j14m', IN),
      mk('WS-02', '⧉', 'siti.n', 'Aktif · AnyDesk', '47m', IN),
      mk('WS-03', '⌨', 'b.santoso', 'Terkunci · Fisik', '18m', LOCK),
      mk('WS-05', '>_', 'rizky', 'Idle · SSH', '32m', IDLE),
      mk('WS-09', '>_', 'arif.w', 'Aktif · SSH', '5j02m', IN),
      mk('WS-01', '⌨', 'nadia.p', 'Aktif · Fisik', '1j08m', IN),
      mk('WS-08', '>_', 'fajar', 'Aktif · SSH', '3j21m', IN),
      mk('WS-06', '>_', 'yusuf', 'Aktif · SSH', '55m', IN),
      mk('WS-04', '—', 'Kosong', 'Offline', '—', OFF),
      mk('WS-10', '—', 'Kosong', 'Offline', '—', OFF),
      mk('WS-11', '—', 'Kosong', 'Offline', '—', OFF),
      mk('WS-12', '—', 'Kosong', 'Offline', '—', OFF),
    ].map(s => ({ ...s, userLabel: s.userLabel === 'Kosong' ? 'Kosong' : `Pengguna: ${s.userLabel}` }));

    return { clock, dateStr, stations };
  }
}
</script>
</body>
</html>
