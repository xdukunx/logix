name: CI

# Light CI for a reference publication. Confirms the cross-platform core
# (bridge + report + SQL helper) parses, imports, and round-trips a log entry
# on Linux, macOS, and Windows — on a SYNTHETIC database only. Also runs the
# server/main.py security-hardening smoke tests (tests/test_server_security.py).
# Never point this at a real logix.db. No PII is ever used in CI.

on:
  push:
  pull_request:

jobs:
  core:
    name: core (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash   # available on all three runners; keeps one script
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all modules
        run: python -m py_compile logix/*.py

      - name: Import + functional round-trip (synthetic DB)
        env:
          LOGIX_DB: ${{ runner.temp }}/synthetic_logix.db
        run: |
          python - <<'PY'
          import importlib, os, subprocess, sys
          sys.path.insert(0, "logix")
          for mod in ("paths", "logbook_sql", "log_physical", "logbook_report", "logbook_ssh_login"):
              importlib.import_module(mod)
              print(f"imported {mod} OK")
          # Write an event and read it back through the actual scripts.
          subprocess.run([sys.executable, "logix/log_physical.py",
                          "--event", "START", "--session-type", "PHYSICAL",
                          "--nama", "CI", "--session-id", "ci-1"], check=True)
          out = subprocess.run([sys.executable, "logix/logbook_sql.py",
                                "select count(*) as n from physical_log"],
                               capture_output=True, text=True, check=True)
          print(out.stdout.strip())
          assert out.stdout.strip().splitlines()[-1] == "1", "round-trip failed"
          # GSheet sync preview must work with no Google deps and leak no PII.
          dry = subprocess.run([sys.executable, "logix/gsheet_sync.py", "--dry-run"],
                               capture_output=True, text=True, check=True)
          assert "DRY RUN" in dry.stdout, dry.stdout
          print("round-trip + dry-run OK")
          PY

      - name: Unit tests (redaction gate, upsert, schedule artifacts, server hardening)
        run: |
          python -m pip install --upgrade pip pytest httpx -r server/requirements.txt
          python -m pytest tests/ -q

  dashboard:
    name: dashboard (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, type-check, and build the React dashboard
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  windows-popup:
    name: windows popup config
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate popup config layer + generated XAML
        shell: pwsh
        run: .\windows\test_logbook_config.ps1

  installer:
    name: installer (linux, system-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the system-wide installer
        run: sudo $(which python) install/install.py
      - name: Verify install + log + query against /opt/software/logix
        run: |
          test -f /opt/software/logix/logix.db || { echo "DB not created"; exit 1; }
          sudo $(which python) /opt/software/logix/log_physical.py \
            --event START --session-type PHYSICAL --nama CI --session-id inst-1
          sudo $(which python) /opt/software/logix/logbook_sql.py \
            "select event,session_type,nama from physical_log"
          sudo $(which python) /opt/software/logix/gsheet_sync.py --dry-run
          bash -n /opt/software/logix/logix-ssh-hook.sh && echo "generated hook is valid"
