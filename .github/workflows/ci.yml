name: CI

# Light CI for a reference publication. Confirms the cross-platform core
# (bridge + report + SQL helper) parses, imports, and round-trips a log entry
# on Linux, macOS, and Windows — on a SYNTHETIC database only. Also runs the
# server/main.py security-hardening smoke tests (tests/test_server_security.py),
# and (server-install) actually runs the central-server install path on a bare
# Ubuntu runner, through to a live /api/health.
# Never point this at a real logix.db. No PII is ever used in CI.

on:
  push:
  pull_request:

jobs:
  core:
    name: core (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash   # available on all three runners; keeps one script
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all modules
        run: python -m py_compile logix/*.py

      - name: Import + functional round-trip (synthetic DB)
        env:
          LOGIX_DB: ${{ runner.temp }}/synthetic_logix.db
        run: |
          python - <<'PY'
          import importlib, os, subprocess, sys
          sys.path.insert(0, "logix")
          for mod in ("paths", "logbook_sql", "log_physical", "logbook_report", "logbook_ssh_login"):
              importlib.import_module(mod)
              print(f"imported {mod} OK")
          # Write an event and read it back through the actual scripts.
          subprocess.run([sys.executable, "logix/log_physical.py",
                          "--event", "START", "--session-type", "PHYSICAL",
                          "--nama", "CI", "--session-id", "ci-1"], check=True)
          out = subprocess.run([sys.executable, "logix/logbook_sql.py",
                                "select count(*) as n from physical_log"],
                               capture_output=True, text=True, check=True)
          print(out.stdout.strip())
          assert out.stdout.strip().splitlines()[-1] == "1", "round-trip failed"
          # GSheet sync preview must work with no Google deps and leak no PII.
          dry = subprocess.run([sys.executable, "logix/gsheet_sync.py", "--dry-run"],
                               capture_output=True, text=True, check=True)
          assert "DRY RUN" in dry.stdout, dry.stdout
          print("round-trip + dry-run OK")
          PY

      - name: Unit tests (redaction gate, upsert, schedule artifacts, server hardening)
        run: |
          python -m pip install --upgrade pip pytest httpx -r server/requirements.txt
          # Captured rather than streamed so a failure can be republished as an
          # annotation: annotations are readable from the checks API, log
          # bodies are not, which is the difference between diagnosing a
          # platform-specific failure and guessing at it.
          if python -m pytest tests/ -q > pytest.log 2>&1; then
            cat pytest.log
          else
            rc=$?
            cat pytest.log
            echo "::error::pytest failed -- $(grep -E "^(FAILED|ERROR)" pytest.log | head -20 | tr -s "[:space:]" " ")"
            echo "::error::tail -- $(tail -c 1200 pytest.log | tr -s "[:space:]" " ")"
            exit $rc
          fi

  lint:
    name: lint (dead code + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately a narrow rule set, not a style police. F catches the
      # things that are genuinely wrong -- unused imports, dead locals,
      # f-strings with no placeholders, undefined names -- and E9 catches
      # syntax and IO errors. Formatting stays a human call; a job that fails
      # on line length is a job people learn to ignore.
      - name: Ruff (pyflakes rules)
        run: |
          python -m pip install --quiet ruff
          python -m ruff check --select F,E9 --exclude frontend .

  dashboard:
    name: dashboard (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, type-check, and build the React dashboard
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  windows-popup:
    name: windows popup config
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate popup config layer + generated XAML
        shell: pwsh
        run: .\windows\test_logbook_config.ps1

  installer:
    name: installer (linux, system-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the system-wide installer
        run: sudo $(which python) install/install.py
      - name: Verify install + log + query against /opt/software/logix
        run: |
          test -f /opt/software/logix/logix.db || { echo "DB not created"; exit 1; }
          sudo $(which python) /opt/software/logix/log_physical.py \
            --event START --session-type PHYSICAL --nama CI --session-id inst-1
          sudo $(which python) /opt/software/logix/logbook_sql.py \
            "select event,session_type,nama from physical_log"
          sudo $(which python) /opt/software/logix/gsheet_sync.py --dry-run
          bash -n /opt/software/logix/logix-ssh-hook.sh && echo "generated hook is valid"

  # The four bugs fixed in 3701e3b (deps never installed, PEP 668
  # externally-managed-environment, missing python3-venv/ensurepip,
  # unconditional sudo on a root image) all reached a real Ubuntu host
  # because nothing here ever RAN the installer -- py_compile and pytest
  # cover the pure builder logic in install/setup_server.py, not the part
  # that shells out to pip. This job executes the actual server install path
  # end to end: setup_server.py -> server/.venv -> go_live.py init ->
  # ops/serve.py -> a live /api/health.
  #
  # Deliberately does NOT use actions/setup-python: the point is the runner's
  # *system* python3 -- the interpreter a fresh Ubuntu host would use, and the
  # one Debian/Ubuntu mark externally managed. Hermetic apart from PyPI, and
  # no real credentials or PII: the values below are throwaway fixtures for
  # one ephemeral runner.
  server-install:
    name: server install (ubuntu, venv + live server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_ADMIN_EMAIL: ci@example.org
      # Not a secret: never used outside this runner, and server/.env is
      # gitignored. Long enough to clear the server's 12-character minimum.
      CI_ADMIN_PASSWORD: ci-throwaway-not-a-secret-9f3a2b6c
      CI_ORIGIN: http://localhost:8000
      CI_PORT: "8791"
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check the one-line bootstrap installer
        run: bash -n install/bootstrap-server.sh

      - name: Prerequisites (the same check bootstrap-server.sh makes)
        run: |
          python3 -VV
          # Debian/Ubuntu package the venv module separately, so `python3 -m
          # venv` fails with "ensurepip is not available" until it is
          # installed. bootstrap-server.sh installs it for the operator;
          # mirror that here so this job tests setup_server.py rather than the
          # runner image's package list.
          if ! python3 -c "import ensurepip" >/dev/null 2>&1; then
            echo "python3-venv is missing on the runner; installing it"
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-venv
          fi
          python3 -c "import ensurepip; print('ensurepip OK')"

      - name: Run install/setup_server.py
        run: |
          python3 install/setup_server.py \
            --admin-emails "$CI_ADMIN_EMAIL" \
            --admin-password "$CI_ADMIN_PASSWORD" \
            --allowed-origins "$CI_ORIGIN" \
            --dev-mode 0

      - name: Assert server/.venv exists and holds the dependencies
        run: |
          test -x server/.venv/bin/python || { echo "server/.venv was not created"; exit 1; }
          server/.venv/bin/python -c "import fastapi, uvicorn, openpyxl; print('deps OK')"
          # The re-exec assertions below are only meaningful while the system
          # interpreter does NOT have these. If a future runner image ships
          # fastapi system-wide, ops/_venv.py correctly stays a no-op and this
          # job quietly stops proving anything -- so say so loudly.
          if python3 -c "import fastapi" >/dev/null 2>&1; then
            echo "::warning::system python3 already has fastapi; the venv re-exec path is not exercised"
            echo "EXPECT_REEXEC=0" >> "$GITHUB_ENV"
          else
            echo "EXPECT_REEXEC=1" >> "$GITHUB_ENV"
          fi

      - name: Assert server/.env was written with the expected keys
        run: |
          test -f server/.env || { echo "server/.env was not written"; exit 1; }
          [ "$(stat -c %a server/.env)" = "600" ] || { echo "server/.env is not 0600"; exit 1; }
          sed -E 's/(PASSWORD|API_KEY)=".*"/\1="<redacted>"/' server/.env

          fail=0
          check() {
            if grep -qxF "$1" server/.env; then
              echo "  ok   $2"
            else
              echo "  FAIL $2 -- expected line: $1"
              fail=1
            fi
          }
          check "ADMIN_EMAILS=\"$CI_ADMIN_EMAIL\"" "ADMIN_EMAILS"
          check "LOGIX_ADMIN_PASSWORD=\"$CI_ADMIN_PASSWORD\"" "LOGIX_ADMIN_PASSWORD"
          check "LOGIX_ALLOWED_ORIGINS=\"$CI_ORIGIN\"" "LOGIX_ALLOWED_ORIGINS"
          check "LOGIX_DEV_MODE=\"0\"" "LOGIX_DEV_MODE"

          # Generated rather than passed in, so match the shape it is
          # generated with: secrets.token_hex(32).
          if grep -qE '^LOGIX_INGEST_API_KEY="[0-9a-f]{64}"$' server/.env; then
            echo "  ok   LOGIX_INGEST_API_KEY (generated, 64 hex chars)"
          else
            echo "  FAIL LOGIX_INGEST_API_KEY missing or not a generated 64-hex key"
            fail=1
          fi

          # Seeded from .env.example and then merged in place: the inline docs
          # must survive, and no key may be appended a second time.
          grep -q '^# --- Ingest API key' server/.env \
            || { echo "  FAIL .env was not seeded from .env.example"; fail=1; }
          for key in ADMIN_EMAILS LOGIX_ADMIN_PASSWORD LOGIX_INGEST_API_KEY \
                     LOGIX_ALLOWED_ORIGINS LOGIX_DEV_MODE; do
            n="$(grep -cE "^$key=" server/.env || true)"
            [ "$n" = "1" ] || { echo "  FAIL $key appears $n time(s), expected 1"; fail=1; }
          done
          exit $fail

      # One assertion per step on purpose: a failing step is then
      # identifiable from the workflow API by name alone, without reading the
      # log body. The first Ubuntu failure here was a single fat step, which
      # reported only that 'something in the production posture' broke.
      - name: go_live.py init (clean DB + generated secrets)
        run: |
          # Log goes to the runner temp dir, never the checkout -- a later
          # step asserts the install leaves the tree pristine. Not piped to
          # tee: a pipeline reports tee's status, which silently swallowed a
          # failing init here for two runs.
          log="$RUNNER_TEMP/go_live.log"
          if python3 ops/go_live.py init --admin-email "$CI_ADMIN_EMAIL" > "$log" 2>&1; then
            cat "$log"
          else
            rc=$?
            cat "$log"
            # Surfaced as an annotation as well as log text: annotations are
            # readable from the checks API, so a failure here is diagnosable
            # without downloading the log archive.
            echo "::error::go_live.py init exited $rc -- $(tail -c 900 "$log" | tr -s "[:space:]" " ")"
            exit $rc
          fi

      - name: go_live.py init re-execs into server/.venv
        if: env.EXPECT_REEXEC == '1'
        run: |
          grep -q "Using the server's virtualenv: .*server/.venv/bin/python" "$RUNNER_TEMP/go_live.log" || { echo "no re-exec happened; log follows:"; cat "$RUNNER_TEMP/go_live.log"; exit 1; }

      - name: init wrote .env.production, mode 0600
        run: |
          set -x
          ls -la server/
          test -f server/.env.production
          [ "$(stat -c %a server/.env.production)" = "600" ]

      - name: init created a clean database
        run: |
          set -x
          test -f server/central_logix.db

      - name: .env.production holds the expected production posture
        run: |
          set -x
          grep -v -e PASSWORD -e API_KEY server/.env.production
          grep -qx "LOGIX_DEV_MODE=0" server/.env.production
          grep -qx "ADMIN_EMAILS=$CI_ADMIN_EMAIL" server/.env.production

      - name: go_live.py check reports no blocking issues
        run: |
          set -x
          python3 ops/go_live.py check
      - name: Start the server (ops/serve.py) and probe /api/health
        run: |
          log="$RUNNER_TEMP/serve.log"
          body="$RUNNER_TEMP/health.json"
          python3 ops/serve.py --host 127.0.0.1 --port "$CI_PORT" > "$log" 2>&1 &
          healthy=""
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$CI_PORT/api/health" -o "$body"; then
              healthy=1
              break
            fi
            sleep 1
          done
          # serve.py re-execs into the venv the same way go_live.py does, so
          # kill the child too -- the backgrounded parent is only waiting on it.
          pkill -f "ops/serve.py" || true
          echo "--- serve.log ---"
          cat "$log"
          [ -n "$healthy" ] || { echo "the server never answered /api/health"; exit 1; }
          echo "--- /api/health ---"
          cat "$body"
          grep -qE '"status" *: *"ok"' "$body" \
            || { echo "unexpected /api/health payload"; exit 1; }
          if [ "$EXPECT_REEXEC" = "1" ]; then
            grep -q "Using the server's virtualenv: .*server/.venv/bin/python" "$log" \
              || { echo "ops/serve.py did not re-exec into server/.venv"; exit 1; }
          fi

      - name: Nothing the install generated is committable
        run: |
          # .env, .env.production, the SQLite database, the logs and the venv
          # all hold secrets or PII. If any of them turns up as untracked or
          # modified here, a .gitignore rule has regressed.
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "the install left files that git would commit:"
            echo "$dirty"
            exit 1
          fi
          echo "working tree clean"
