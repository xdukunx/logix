[package]
name = "logix"
version = "1.3.0"
edition = "2021"
description = "Logix workstation core: session logging, server sync and the resident agent, in one small native binary."
license = "MIT"
publish = false

[[bin]]
name = "logix"
path = "src/main.rs"

[dependencies]
# Bundled SQLite: no DLL to ship, same file format the Python core reads.
rusqlite = { version = "0.40", features = ["bundled"] }
# preserve_order so raw_json keeps the payload's own key order, like Python's json.
serde_json = { version = "1", features = ["preserve_order"] }
# native-tls = schannel on Windows: it trusts the Windows certificate store,
# which is where the installer puts a lab server's own certificate. rustls with
# bundled roots would reject exactly the servers labs actually run.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
