# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: MindLab.Logix
PackageVersion: 1.1.1
InstallerType: inno
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
# Inno Setup silent switches are well-known to winget, but pin them so the
# server-settings wizard page is skipped on silent installs (configure after
# install via the Logix settings popup or by re-running install_logbook_tasks).
InstallerSwitches:
  Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
  SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART /SP-
ProductCode: '{B7A0C1D4-5E2F-4A63-9C58-1F0D2E7A8B3C}_is1'
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/xdukunx/logix/releases/download/v1.1.1/LogixAgentSetup.exe
    # SHA256 of the v1.1.1 release asset (computed from the published .exe).
    # If the release asset is ever rebuilt/replaced, recompute:
    #   (Get-FileHash LogixAgentSetup.exe -Algorithm SHA256).Hash
    InstallerSha256: 51DDC119E867C72A581F03050E97575056685B7224FD99A4525D4B1D9ACF32E6
ManifestType: installer
ManifestVersion: 1.6.0
