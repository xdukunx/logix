ShortDescription: Privacy-first sign-in logbook agent for shared Windows lab computers.
Description: |-
  Logix records who used a shared computer, when, and for what purpose --
  never screen contents or keystrokes. This installs the Windows agent: the
  lock/unlock sign-in prompt, the session timer widget, the resident monitor
  scheduled task, and the native Python logging core. Configure the server via
  the Logix settings popup after install. AnyDesk is not bundled (the
  dashboard "Remote" action activates once AnyDesk is installed separately).
